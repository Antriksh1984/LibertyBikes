; LibertyBikes - Vice City motorbikes for GTA III
; Each bike needs: a "bike" line in data\default.ide, its model in models\gta3.img and a
; collision entry in models\coll\vehicles.col (tools\install_assets.py does all three).

[Bikes]
Models=PCJ600
; Test spawner: this key puts the first bike 4 m in front of you (0x73 = F4, 0 = off)
SpawnKey=0x73

[PCJ600]
ModelId=151
GxtKey=PCJ600
Name=PCJ-600
; III car whose engine sounds the bike borrows (111 = Kuruma). Real VC bike sounds come later.
AudioDonorModel=111
; Vice City handling.cfg lines for the PCJ-600 (its "BIKE" entry and its "!" bike entry), unchanged.
Handling=BIKE 500.0 0.8 1.8 1.2 0.0 0.05 -0.09 103 1.6 0.9 0.48 5 190.0 50.0 R P 15.0 0.50 0 35.0 0.85 0.15 0.3 0.15 10000 0.15 -0.16 0.5 0.0 10102 1 1
